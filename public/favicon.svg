<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="planetGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="4" y1="20" x2="60" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="22" fill="#7C3AED" opacity="0.3" filter="url(#glow)"/>
  <!-- Planet Body -->
  <circle cx="32" cy="32" r="18" fill="url(#planetGrad)" />
  <circle cx="28" cy="26" r="13" fill="#C084FC" opacity="0.25" filter="url(#glow)"/>
  <!-- Orbit Ring Behind -->
  <path d="M 10 37 C 12 43, 24 48, 36 46 C 48 44, 56 37, 54 31" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <!-- Orbit Ring Front -->
  <path d="M 8 32 C 6 25, 18 19, 32 19 C 46 19, 58 25, 56 33 C 54 39, 44 45, 30 45 C 18 45, 9 39, 8 32 Z" stroke="url(#ringGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <!-- Small satellite/sparkle -->
  <circle cx="48" cy="21" r="2.5" fill="#FFFFFF" />
  <circle cx="16" cy="42" r="1.5" fill="#E0E7FF" />
</svg>
